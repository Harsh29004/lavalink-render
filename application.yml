spring:
  config:
    import: optional:configserver:

server:
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  server:
    password: "vision"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gcWarningThreshold: 30
    youtubePacketThrottle: 120
    youtubePacketThrottleFactor: 50
    ytPlaylistMaxItems: 200

metrics:
  prometheus:
    enabled: true
    endpoint: /metrics

plugins:
  - dependency: com.github.lavalink-devs:youtube-source:1.18.2
    snapshot: false
    repository: https://maven.lavalink.dev/releases/
    youtubePlugin:
      mixPlaylist: true
      search:
        enabled: true
      allowSearch: true
      enableSearchFilter: true
      extendedSearch: true
      client: WEB
      oauth:
        refreshToken: ""
  - dependency: com.github.topi314:Lavasrc:4.8.3
    snapshot: false
    repository: https://maven.lavalink.dev/releases/
    lavasrc:
      providers:
        - "scsearch:\"%s\""
        - "jssearch:\"%s\""
        - "ytsearch:\"%s\""
        - "ytmsearch:\"%s\""
      sources:
        spotify: true
        applemusic: true
        deezer: true
        yandexmusic: true
        jiosaavn: true
        gaana: true
      spotify:
        clientId: "170948aa0bf4471ab68ec6fad28d1190"
        clientSecret: "6ffcdd9dc48c44e3bbc6dc828e055831"
        countryCode: "IN"
      applemusic:
        countryCode: "IN"
        mediaAPIToken: "none"
      deezer:
        masterDecryptionKey: "none"
      yandexmusic:
        accessToken: "none"
      jiosaavn:
        countryCode: "IN"
      gaana:
        accessToken: "none"
